[project]
name = "EuroSAT-Land-Cover-Classification"
version = "0.1.0"
description = "CNN-based land use classification on EuroSAT — comparing RGB vs. 13-band Sentinel-2 multispectral input"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.2",
    "folium>=0.20.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pillow>=12.1.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "streamlit>=1.56.0",
    "streamlit-folium>=0.27.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
]
